name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4
      
      - name: ⚙️ Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 📦 Kutubxonalarni o'rnatish
        run: npm install
      
      - name: 🔨 EXE yasash
        run: npm run build:win
      
      - name: 📤 EXE ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: KOMPLAYENS-KADR-EXE
          path: dist/*.exe
          retention-days: 30
